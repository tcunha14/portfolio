
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto | Tomás Cunha</title>

    <style>
        :root {
            --bg: #101214;
            --panel: #181c1f;
            --text: #f1f3f2;
            --muted: #a4adae;
            --line: #30383b;
            --accent: #d34b45;
            --max: 1160px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            width: min(var(--max), calc(100% - 40px));
            margin: auto;
        }

        /* Cabeçalho */
        header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: #101214ed;
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(12px);
        }

        .nav {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-weight: 850;
            letter-spacing: .13em;
        }

        .brand span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 24px;
            color: var(--muted);
            font-size: 13px;
        }

        /* Elementos gerais */
        .eyebrow {
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            padding: 12px 17px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #17191a;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .btn.alt {
            background: transparent;
            color: var(--text);
            border-color: var(--line);
        }

        .muted {
            color: var(--muted);
        }

        /* Elementos visuais */
        .art {
            min-height: 350px;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #242b2f, #141719);
            border: 1px solid var(--line);
        }

        .art:before,
        .art:after {
            content: '';
            position: absolute;
            width: 260px;
            height: 180px;
            border: 1px solid #596166;
            transform: rotate(-25deg);
        }

        .art:after {
            width: 190px;
            height: 130px;
            border-color: var(--accent);
            transform: rotate(35deg);
        }

        .shape {
            width: 140px;
            height: 140px;
            border: 2px solid var(--accent);
            transform: rotate(45deg);
            box-shadow: 0 0 60px #d34b4520;
        }

        .shape:before,
        .shape:after {
            content: '';
            display: block;
            border: 1px solid var(--accent);
            position: absolute;
            inset: 18px;
        }

        .shape:after {
            inset: 38px;
        }

        .art small {
            position: absolute;
            bottom: 16px;
            left: 18px;
            color: var(--muted);
            font-size: 9px;
            letter-spacing: .15em;
        }

        /* Secções */
        section {
            padding: 75px 0;
            border-top: 1px solid var(--line);
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 25px;
            margin-bottom: 28px;
        }

        .section-head h2 {
            font-size: clamp(32px, 4vw, 48px);
            letter-spacing: -.05em;
            margin: 8px 0 0;
        }

        .section-head p {
            max-width: 420px;
            color: var(--muted);
            font-size: 14px;
        }

        /* Filtros */
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
            padding: 8px 13px;
            cursor: pointer;
        }

        .filter.active,
        .filter:hover {
            background: var(--accent);
            color: #17191a;
            border-color: var(--accent);
        }

        /* Grelha de projetos */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            transition: .2s;
            display: block;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .cover {
            height: 210px;
            background: linear-gradient(135deg, #252c30, #15191b);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover .shape {
            width: 95px;
            height: 95px;
        }

        .cardbody {
            padding: 18px;
        }

        .cardbody h3 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .cardbody p {
            color: var(--muted);
            font-size: 13px;
            margin: 0;
        }

        .tag {
            display: inline-block;
            color: var(--accent);
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-top: 12px;
        }

        /* Competências */
        .skills {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .skill {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 20px;
        }

        .skill b {
            display: block;
            margin: 14px 0 5px;
        }

        .skill p {
            font-size: 12px;
            color: var(--muted);
            margin: 0;
        }

        /* Contactos e rodapé */
        .contact {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer {
            padding: 25px 0;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 11px;
        }

        /* Página de detalhe do projeto */
        .back {
            display: inline-block;
            color: var(--accent);
            margin: 28px 0;
        }

        .detailhero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: center;
            padding: 20px 0 55px;
        }

        .detailhero h1 {
            font-size: clamp(38px, 6vw, 65px);
            line-height: 1.03;
            letter-spacing: -.05em;
            margin: 10px 0;
        }

        .detailvisual {
            min-height: 320px;
            background: linear-gradient(140deg, #252c30, #15191b);
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .detailvisual img {
            width: 100%;
            height: 100%;
            min-height: 320px;
            object-fit: cover;
        }

        .cols {
            display: grid;
            grid-template-columns: 1.3fr .7fr;
            gap: 35px;
        }

        .info {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 22px;
        }

        /* Galeria */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .gallery img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border: 1px solid var(--line);
        }

        .emptyphoto {
            height: 180px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 15px;
            background: var(--panel);
            border: 1px dashed #50595d;
            color: var(--muted);
            font-size: 12px;
        }

        /* Tablets */
        @media (max-width: 800px) {
            .hero,
            .detailhero {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .skills {
                grid-template-columns: repeat(2, 1fr);
            }

            .cols {
                grid-template-columns: 1fr;
            }
        }

        /* Telemóveis */
        @media (max-width: 560px) {
            .wrap {
                width: calc(100% - 28px);
            }

            nav {
                gap: 10px;
            }

            nav a:nth-child(n+2) {
                display: none;
            }

            .hero {
                padding: 55px 0;
            }

            .art {
                min-height: 260px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .cover {
                height: 190px;
            }

            .skills {
                grid-template-columns: 1fr 1fr;
            }

            .section-head {
                display: block;
            }

            .contact {
                display: block;
            }

            .contact .btn {
                margin-top: 12px;
            }

            .gallery {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <div class="wrap nav">
            <a class="brand" href="index.html">
                TOMÁS CUNHA<span>.</span>
            </a>

            <a class="btn alt" href="index.html#projetos">
                Voltar aos projetos
            </a>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="wrap">

        <a class="back" href="index.html#projetos">
            ← Voltar aos projetos
        </a>

        <div id="detail">
            <p class="muted">A carregar projeto...</p>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="wrap">
            TOMÁS CUNHA. / 3D DESIGN & PRINTING
        </div>
    </footer>

    <script>
        // Evita que o conteúdo inserido no HTML interprete caracteres especiais como código.
        function esc(s = '') {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }

        // Obtém o ID do projeto através do endereço da página.
        const id = new URLSearchParams(location.search).get('id');

        // Carrega os projetos a partir do ficheiro projects.json.
        fetch('projects.json')
            .then(r => r.json())
            .then(items => {

                // Procura o projeto correspondente ao ID.
                const p = items.find(x => x.id === id);

                // Se não encontrar o projeto, apresenta uma mensagem.
                if (!p) {
                    document.getElementById('detail').innerHTML =
                        '<h1>Projeto não encontrado</h1>';
                    return;
                }

                // Atualiza o título da página.
                document.title = p.title + ' | Tomás Cunha';

                // Obtém as imagens da galeria.
                const photos = (p.gallery || []).filter(Boolean);

                // Apresenta os detalhes do projeto.
                document.getElementById('detail').innerHTML = `

                    <div class="detailhero">

                        <div>
                            <div class="eyebrow">
                                ${esc(p.categoryLabel || p.category)}
                            </div>

                            <h1>${esc(p.title)}</h1>

                            <p class="muted">
                                ${esc(p.summary || '')}
                            </p>

                            ${p.link ? `
                                <a class="btn"
                                   href="${esc(p.link)}"
                                   target="_blank"
                                   rel="noopener">
                                    ${esc(p.linkLabel || 'Ver projeto externo')}
                                </a>
                            ` : ''}
                        </div>

                        <div class="detailvisual">
                            ${p.cover ? `
                                <img src="${p.cover}" alt="${esc(p.title)}">
                            ` : `
                                <div class="shape"></div>
                            `}
                        </div>

                    </div>

                    <section>

                        <div class="cols">

                            <div>
                                <h2>Sobre o projeto</h2>

                                <p class="muted" style="white-space:pre-wrap">
                                    ${esc(p.description || '')}
                                </p>
                            </div>

                            <aside class="info">
                                <h3>Ferramentas e competências</h3>

                                <p class="muted">
                                    ${esc(p.tools || '')}
                                </p>
                            </aside>

                        </div>

                    </section>

                    ${photos.length ? `
                        <section>

                            <h2>Galeria do projeto</h2>

                            <div class="gallery">
                                ${photos.map((src, i) => `
                                    <img
                                        src="${src}"
                                        alt="${esc(p.title)} - imagem ${i + 1}"
                                    >
                                `).join('')}
                            </div>

                        </section>
                    ` : ''}

                `;
            })

            // Apresenta uma mensagem caso não seja possível carregar o ficheiro.
            .catch(() => {
                document.getElementById('detail').innerHTML =
                    '<p class="muted">Não foi possível carregar os dados do projeto.</p>';
            });
    </script>

</body>
</html>
